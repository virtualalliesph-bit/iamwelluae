name: Rebuild main product templates from original source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-main-products-from-source.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original product layouts with safe UAE hero
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          SOURCE = 'fb7b4534c4294bf00a77fc6f7f0a3e4380ca46ea'
          templates = [
              'product.json',
              'product.no-add-to-cart.json',
              'product.sample.json',
              'product.smart-gummies.json',
          ]

          hero = {
              'type': 'iamw-uae-product-hero',
              'settings': {
                  'badge_text': '',
                  'show_rating': True,
                  'rating_stars': '★★★★★',
                  'rating_text': '1013+ reviews',
                  'nutrition_label': 'Nutrition Facts',
                  'fda_label': 'FDA Certification',
                  'page_width': 1260,
                  'column_gap': 12,
                  'media_radius': 12,
                  'title_size': 24,
                  'mobile_title_size': 24,
                  'price_size': 24,
                  'mobile_price_size': 24,
                  'padding_top': 34,
                  'padding_bottom': 48,
                  'mobile_padding_top': 20,
                  'mobile_padding_bottom': 40,
                  'background': '#ffffff',
                  'soft_background': '#f7effb',
                  'purple': '#42106b',
                  'orange': '#ff8f23',
                  'text_color': '#161116'
              }
          }

          def clear_old_store_ids(value):
              if isinstance(value, dict):
                  for key in list(value):
                      if key == 'box_variant_id':
                          value[key] = ''
                      else:
                          clear_old_store_ids(value[key])
              elif isinstance(value, list):
                  for item in value:
                      clear_old_store_ids(item)

          for filename in templates:
              raw = subprocess.check_output(
                  ['git', 'show', f'{SOURCE}:templates/{filename}'],
                  text=True
              )
              data = json.loads(raw)
              sections = data.setdefault('sections', {})
              if 'main' in sections:
                  sections['main'] = hero
              clear_old_store_ids(data)
              Path('templates', filename).write_text(
                  json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n',
                  encoding='utf-8'
              )
          PY

      - name: Verify original section sequence retained
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='templates/product.no-add-to-cart.json'
          d=json.load(open(p, encoding='utf-8'))
          expected=[
            'iamw_product_hero',
            'box_checkout_popup_9MtFE6',
            'section_GmBadz',
            'carousel_7BAfF4',
            'iamw_ref_07_social_proof_EAqHCN',
            'section_qDTpMM',
            'carousel_BpzRy3',
            'iamw_ref_07_social_proof_QJFG76',
            'product_list_zR9Cym',
            'blocks_qqPDJw',
            'section_xArXhJ',
            '1766971346f9022756',
            'section_DFCmU6'
          ]
          # main keeps its original position but is renamed for the safe renderer.
          order=d['order']
          if order and order[0]=='main':
              order[0]='iamw_product_hero'
          d['sections']['iamw_product_hero']=d['sections'].pop('main')
          d['order']=order
          json.dump(d, open(p,'w',encoding='utf-8'), ensure_ascii=False, separators=(',', ':'))
          open(p,'a',encoding='utf-8').write('\n')
          if d['order'] != expected:
              raise SystemExit(f'Unexpected product sequence: {d["order"]}')
          if d['sections']['box_checkout_popup_9MtFE6']['settings'].get('box_variant_id'):
              raise SystemExit('Old box variant id still present')
          print('Verified full original no-add-to-cart section sequence with safe UAE hero.')
          PY

      - name: Normalize safe hero key in other product templates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [Path('templates/product.json'), Path('templates/product.sample.json'), Path('templates/product.smart-gummies.json')]:
              d=json.loads(p.read_text(encoding='utf-8'))
              if 'main' in d.get('sections', {}):
                  d['sections']['iamw_product_hero']=d['sections'].pop('main')
                  d['order']=['iamw_product_hero' if x=='main' else x for x in d.get('order', [])]
              p.write_text(json.dumps(d, ensure_ascii=False, separators=(',', ':'))+'\n', encoding='utf-8')
          PY

      - name: Commit rebuilt product templates and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/rebuild-main-products-from-source.yml
          git add templates/product.json templates/product.no-add-to-cart.json templates/product.sample.json templates/product.smart-gummies.json .github/workflows/rebuild-main-products-from-source.yml
          git commit -m 'rebuild: restore original IAMW product layouts with safe UAE hero'
          git push origin HEAD:main
