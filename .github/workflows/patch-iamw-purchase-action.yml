name: Patch IAMW purchase action

on:
  push:
    branches:
      - horizon-rebuild
    paths:
      - .github/workflows/patch-iamw-purchase-action.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'iamw-theme-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: horizon-rebuild
          fetch-depth: 0

      - name: Add configurable cart or checkout behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def split_schema(text):
              before, rest = text.split('{% schema %}', 1)
              raw, after = rest.split('{% endschema %}', 1)
              return before, json.loads(raw), after

          def join_schema(before, schema, after):
              return before + '{% schema %}\n' + json.dumps(schema, ensure_ascii=False, indent=2) + '\n{% endschema %}' + after

          select_setting = {
              'type': 'select',
              'id': 'purchase_action',
              'label': 'Button action',
              'options': [
                  {'value': 'checkout', 'label': 'Go directly to checkout'},
                  {'value': 'cart', 'label': 'Add to cart and open cart page'}
              ],
              'default': 'checkout'
          }

          for name in ['sections/iamw-picky-landing.liquid', 'sections/iamw-brain-landing.liquid']:
              p = Path(name)
              text = p.read_text()
              text = text.replace(
                  'data-iamw-buy {% unless p.selected_or_first_available_variant.available %}',
                  'data-iamw-buy data-action="{{ block.settings.purchase_action | default: \'checkout\' }}" {% unless p.selected_or_first_available_variant.available %}',
                  1
              )
              text = text.replace(
                  "window.location.assign('/checkout');",
                  "const action = button.dataset.action || 'checkout';\n        window.location.assign(action === 'cart' ? '/cart' : '/checkout');",
                  1
              )
              before, schema, after = split_schema(text)
              bundle = next(b for b in schema['blocks'] if b['type'] == 'bundle')
              if not any(s.get('id') == 'purchase_action' for s in bundle['settings']):
                  idx = next(i for i, s in enumerate(bundle['settings']) if s.get('id') == 'button_label') + 1
                  bundle['settings'].insert(idx, select_setting)
              p.write_text(join_schema(before, schema, after))

          p = Path('sections/iamw-product-page.liquid')
          text = p.read_text()
          text = text.replace(
              'data-iamw-buy {% unless product.selected_or_first_available_variant.available %}',
              'data-iamw-buy data-action="{{ section.settings.purchase_action | default: \'checkout\' }}" {% unless product.selected_or_first_available_variant.available %}',
              1
          )
          text = text.replace(
              "window.location.assign('/checkout');",
              "const action = button.dataset.action || 'checkout';\n        window.location.assign(action === 'cart' ? '/cart' : '/checkout');",
              1
          )
          before, schema, after = split_schema(text)
          if not any(s.get('id') == 'purchase_action' for s in schema['settings']):
              idx = next(i for i, s in enumerate(schema['settings']) if s.get('id') == 'button_label') + 1
              schema['settings'].insert(idx, select_setting)
          p.write_text(join_schema(before, schema, after))

          for name in ['templates/index.json', 'templates/page.picky-eater.json', 'templates/page.pampatalino.json']:
              p = Path(name)
              data = json.loads(p.read_text())
              for section in data.get('sections', {}).values():
                  for block in section.get('blocks', {}).values():
                      if block.get('type') == 'bundle':
                          block.setdefault('settings', {})['purchase_action'] = block.get('settings', {}).get('purchase_action', 'checkout')
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          p = Path('templates/product.json')
          data = json.loads(p.read_text())
          data['sections']['main'].setdefault('settings', {})['purchase_action'] = data['sections']['main'].get('settings', {}).get('purchase_action', 'checkout')
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit patch
        run: |
          git config user.name "iamw-theme-bot"
          git config user.email "iamw-theme-bot@users.noreply.github.com"
          git add sections/iamw-picky-landing.liquid sections/iamw-brain-landing.liquid sections/iamw-product-page.liquid templates/index.json templates/page.picky-eater.json templates/page.pampatalino.json templates/product.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "feat: add cart or checkout option to IAMW buy buttons"
          git push origin HEAD:horizon-rebuild
