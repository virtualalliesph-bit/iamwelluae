name: Restore UAE homepage sections

on:
  push:
    paths:
      - '.github/workflows/restore-uae-homepage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore UAE section composition safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess

          # Reuse the already-imported UAE page composition as the homepage.
          raw = subprocess.check_output(['git', 'show', 'HEAD:templates/page.uae.json'], text=True)
          data = json.loads(raw)

          # A homepage has no page object, so remove the disabled page wrapper.
          data.get('sections', {}).pop('main', None)
          data['order'] = [x for x in data.get('order', []) if x != 'main']

          # Clear resource references that belong to the source Shopify store.
          # Keep the section/block structure, copy, layout, colors and sizing.
          resource_keys = {
              'product', 'collection', 'box_product_handle', 'box_variant_id'
          }

          def clean(value):
              if isinstance(value, dict):
                  out = {}
                  for key, child in value.items():
                      if isinstance(child, str):
                          if child.startswith('shopify://'):
                              out[key] = ''
                              continue
                          if key.lower() in resource_keys:
                              out[key] = ''
                              continue
                      out[key] = clean(child)
                  return out
              if isinstance(value, list):
                  return [clean(x) for x in value]
              return value

          data = clean(data)
          with open('templates/index.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, separators=(',', ':'))
              f.write('\n')
          PY

      - name: Commit restored homepage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/index.json
          if git diff --cached --quiet; then
            echo "Homepage is already restored."
          else
            git commit -m "fix: restore IAMW UAE homepage sections"
            git push origin HEAD:main
          fi
