name: Import exact IAMW theme

on:
  workflow_dispatch:
  push:
    paths:
      - '.theme-import/manifest-*.tsv'
      - '.github/workflows/import-matching-theme-files.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch comparison theme
        run: git clone --depth 1 https://github.com/liudakarapet10/zipfit.git /tmp/tinker-source

      - name: Copy exact checksum matches
        shell: bash
        run: |
          set -euo pipefail
          cat .theme-import/manifest-1.tsv .theme-import/manifest-2.tsv > /tmp/theme-manifest.tsv
          : > .theme-import/mismatches.tsv
          matched=0
          mismatched=0
          while IFS=$'\t' read -r expected path; do
            [ -n "$path" ] || continue
            source="/tmp/tinker-source/$path"
            if [ -f "$source" ]; then
              actual=$(git -C /tmp/tinker-source hash-object "$path")
              if [ "$actual" = "$expected" ]; then
                mkdir -p "$(dirname "$path")"
                cp "$source" "$path"
                matched=$((matched + 1))
              else
                printf '%s\t%s\t%s\tdifferent\n' "$expected" "$actual" "$path" >> .theme-import/mismatches.tsv
                mismatched=$((mismatched + 1))
              fi
            else
              printf '%s\t-\t%s\tmissing\n' "$expected" "$path" >> .theme-import/mismatches.tsv
              mismatched=$((mismatched + 1))
            fi
          done < /tmp/theme-manifest.tsv
          echo "Exact matches copied: $matched"
          echo "Files needing exact patch: $mismatched"

      - name: Download and apply exact theme patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-8798-8206-8f02-f209cc0b0300/raw?se=2026-10-07T05%3A12%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=e9665c80-9805-5191-9319-ece17eb9945e&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T01%3A12%3A49Z&ske=2026-10-08T01%3A12%3A49Z&sks=b&skv=2026-02-06&sig=Vsp4BjNE9NBXYLACoToDSYZ/bNNv%2BnUIvzNIgwlriIM%3D' -o /tmp/exact-theme.patch.xz
          xz -dc /tmp/exact-theme.patch.xz > /tmp/exact-theme.patch
          git apply --check --binary /tmp/exact-theme.patch
          git apply --binary /tmp/exact-theme.patch

      - name: Verify imported files against uploaded-theme manifest
        shell: bash
        run: |
          set -euo pipefail
          cat .theme-import/manifest-1.tsv .theme-import/manifest-2.tsv > /tmp/theme-manifest.tsv
          : > /tmp/verify-mismatches.tsv
          ok=0
          bad=0
          while IFS=$'\t' read -r expected path; do
            [ -n "$path" ] || continue
            if [ -f "$path" ]; then
              actual=$(git hash-object "$path")
              if [ "$actual" = "$expected" ]; then
                ok=$((ok + 1))
              else
                printf '%s\t%s\t%s\n' "$expected" "$actual" "$path" >> /tmp/verify-mismatches.tsv
                bad=$((bad + 1))
              fi
            else
              printf '%s\t-\t%s\n' "$expected" "$path" >> /tmp/verify-mismatches.tsv
              bad=$((bad + 1))
            fi
          done < /tmp/theme-manifest.tsv
          echo "Verified files: $ok"
          echo "Verification mismatches: $bad"
          if [ "$bad" -ne 0 ]; then
            cat /tmp/verify-mismatches.tsv
            exit 1
          fi

      - name: Commit imported theme
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets blocks config layout locales sections snippets templates .theme-import/mismatches.tsv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Theme already matches the uploaded export."
          else
            git commit -m "chore: import IAMW UAE Shopify theme export"
            git push origin HEAD:main
          fi
