name: Import exact IAMW theme

on:
  workflow_dispatch:
  push:
    paths:
      - '.theme-import/manifest-*.tsv'
      - '.theme-import/exact.patch.b64.part*'
      - '.github/workflows/import-matching-theme-files.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch comparison theme
        run: git clone --depth 1 https://github.com/liudakarapet10/zipfit.git /tmp/tinker-source

      - name: Copy exact checksum matches
        shell: bash
        run: |
          set -euo pipefail
          cat .theme-import/manifest-1.tsv .theme-import/manifest-2.tsv > /tmp/theme-manifest.tsv
          : > .theme-import/mismatches.tsv
          matched=0
          mismatched=0
          while IFS=$'\t' read -r expected path; do
            [ -n "$path" ] || continue
            source="/tmp/tinker-source/$path"
            if [ -f "$source" ]; then
              actual=$(git -C /tmp/tinker-source hash-object "$path")
              if [ "$actual" = "$expected" ]; then
                mkdir -p "$(dirname "$path")"
                cp "$source" "$path"
                matched=$((matched + 1))
              else
                printf '%s\t%s\t%s\tdifferent\n' "$expected" "$actual" "$path" >> .theme-import/mismatches.tsv
                mismatched=$((mismatched + 1))
              fi
            else
              printf '%s\t-\t%s\tmissing\n' "$expected" "$path" >> .theme-import/mismatches.tsv
              mismatched=$((mismatched + 1))
            fi
          done < /tmp/theme-manifest.tsv
          echo "Exact matches copied: $matched"
          echo "Files needing exact patch: $mismatched"

      - name: Rebuild and apply exact theme patch
        shell: bash
        run: |
          set -euo pipefail
          cat .theme-import/exact.patch.b64.part* | base64 --decode > /tmp/exact.patch.zst
          zstd -d -f /tmp/exact.patch.zst -o /tmp/exact.patch
          if git apply --check --binary /tmp/exact.patch; then
            git apply --binary /tmp/exact.patch
            echo "Exact patch applied."
          else
            echo "Patch is not applicable to the current tree; checking whether the target files are already present."
          fi

      - name: Verify imported files against uploaded-theme manifest
        shell: bash
        run: |
          set -euo pipefail
          cat .theme-import/manifest-1.tsv .theme-import/manifest-2.tsv > /tmp/theme-manifest.tsv
          : > /tmp/verify-mismatches.tsv
          ok=0
          bad=0
          while IFS=$'\t' read -r expected path; do
            [ -n "$path" ] || continue
            if [ -f "$path" ]; then
              actual=$(git hash-object "$path")
              if [ "$actual" = "$expected" ]; then
                ok=$((ok + 1))
              else
                printf '%s\t%s\t%s\n' "$expected" "$actual" "$path" >> /tmp/verify-mismatches.tsv
                bad=$((bad + 1))
              fi
            else
              printf '%s\t-\t%s\n' "$expected" "$path" >> /tmp/verify-mismatches.tsv
              bad=$((bad + 1))
            fi
          done < /tmp/theme-manifest.tsv
          echo "Verified files: $ok"
          echo "Verification mismatches: $bad"
          if [ "$bad" -ne 0 ]; then
            cat /tmp/verify-mismatches.tsv
            exit 1
          fi

      - name: Commit imported theme
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets blocks config layout locales sections snippets templates .theme-import/mismatches.tsv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Theme already matches the uploaded export."
          else
            git commit -m "chore: import IAMW UAE Shopify theme export"
            git push origin HEAD:main
          fi
