name: Install IAMW Brain Support Page

on:
  push:
    branches:
      - horizon-rebuild
    paths:
      - .github/workflows/install-iamw-brain-support.yml

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'iamw-brain-page-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: horizon-rebuild
          fetch-depth: 0

      - name: Install reusable Brain Support page files
        shell: bash
        run: |
          cat .github/iamw-brain-payload/part-*.txt > /tmp/iamw_payload.txt
          python - <<'PY'
          import base64, tarfile, io, pathlib
          payload = pathlib.Path('/tmp/iamw_payload.txt').read_text().strip()
          data = base64.b64decode(payload)
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as tf:
              tf.extractall('.')
          PY

      - name: Commit Brain Support template
        run: |
          git config user.name "iamw-brain-page-bot"
          git config user.email "iamw-brain-page-bot@users.noreply.github.com"
          git add sections/iamw-brain-hero.liquid \
                  sections/iamw-parent-pains.liquid \
                  sections/iamw-brain-benefits.liquid \
                  sections/iamw-routine-bundle.liquid \
                  sections/iamw-product-offer-v2.liquid \
                  sections/iamw-testimonials-v2.liquid \
                  sections/iamw-comparison-v2.liquid \
                  sections/iamw-final-cta.liquid \
                  snippets/iamw-icon.liquid \
                  assets/iamw-brain-landing.css \
                  assets/iamw-brain-testimonials.js \
                  templates/page.brain-support.json
          git commit -m "feat: add reusable IAMW brain support landing page"
          git push origin HEAD:horizon-rebuild
