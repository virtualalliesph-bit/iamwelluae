name: Add IAMW page purchase behavior

on:
  push:
    branches:
      - horizon-rebuild
    paths:
      - .github/workflows/add-page-purchase-default.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'iamw-theme-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: horizon-rebuild
          fetch-depth: 0

      - name: Add page default with per-bundle override
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def split_schema(text):
              before, rest = text.split('{% schema %}', 1)
              raw, after = rest.split('{% endschema %}', 1)
              return before, json.loads(raw), after

          def join_schema(before, schema, after):
              return before + '{% schema %}\n' + json.dumps(schema, ensure_ascii=False, indent=2) + '\n{% endschema %}' + after

          page_setting = {
              'type': 'select',
              'id': 'purchase_action_default',
              'label': 'Default purchase behavior',
              'info': 'Controls all bundle buttons unless a bundle has its own override.',
              'options': [
                  {'value': 'checkout', 'label': 'Go directly to checkout'},
                  {'value': 'cart', 'label': 'Add to cart and open cart page'}
              ],
              'default': 'checkout'
          }

          bundle_setting = {
              'type': 'select',
              'id': 'purchase_action',
              'label': 'Button action',
              'options': [
                  {'value': 'inherit', 'label': 'Use page default'},
                  {'value': 'checkout', 'label': 'Go directly to checkout'},
                  {'value': 'cart', 'label': 'Add to cart and open cart page'}
              ],
              'default': 'inherit'
          }

          for name in ['sections/iamw-picky-landing.liquid', 'sections/iamw-brain-landing.liquid']:
              p = Path(name)
              text = p.read_text()

              old = '<button type="button" class="iamw-btn iamw-buy" data-iamw-buy data-action="{{ block.settings.purchase_action | default: \'checkout\' }}" {% unless p.selected_or_first_available_variant.available %}disabled{% endunless %}>'
              new = '''{% assign iamw_action = block.settings.purchase_action %}\n                {% if iamw_action == blank or iamw_action == 'inherit' %}\n                  {% assign iamw_action = section.settings.purchase_action_default | default: 'checkout' %}\n                {% endif %}\n                <button type="button" class="iamw-btn iamw-buy" data-iamw-buy data-action="{{ iamw_action }}" {% unless p.selected_or_first_available_variant.available %}disabled{% endunless %}>'''
              if old in text:
                  text = text.replace(old, new, 1)

              before, schema, after = split_schema(text)

              if not any(s.get('id') == 'purchase_action_default' for s in schema['settings']):
                  try:
                      idx = next(i for i,s in enumerate(schema['settings']) if s.get('id') == 'products_intro') + 1
                  except StopIteration:
                      idx = len(schema['settings'])
                  schema['settings'].insert(idx, page_setting)

              bundle = next(b for b in schema['blocks'] if b['type'] == 'bundle')
              current = next((s for s in bundle['settings'] if s.get('id') == 'purchase_action'), None)
              if current:
                  current.clear(); current.update(bundle_setting)
              else:
                  idx = next(i for i,s in enumerate(bundle['settings']) if s.get('id') == 'button_label') + 1
                  bundle['settings'].insert(idx, bundle_setting)

              p.write_text(join_schema(before, schema, after))

          for name in ['templates/index.json', 'templates/page.picky-eater.json', 'templates/page.pampatalino.json']:
              p = Path(name)
              data = json.loads(p.read_text())
              for section in data.get('sections', {}).values():
                  if section.get('type') in ('iamw-picky-landing','iamw-brain-landing'):
                      section.setdefault('settings', {})['purchase_action_default'] = section.get('settings', {}).get('purchase_action_default', 'checkout')
                      for block in section.get('blocks', {}).values():
                          if block.get('type') == 'bundle':
                              block.setdefault('settings', {})['purchase_action'] = 'inherit'
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit patch
        run: |
          git config user.name "iamw-theme-bot"
          git config user.email "iamw-theme-bot@users.noreply.github.com"
          git add sections/iamw-picky-landing.liquid sections/iamw-brain-landing.liquid templates/index.json templates/page.picky-eater.json templates/page.pampatalino.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "feat: add page-level purchase behavior with bundle override"
          git push origin HEAD:horizon-rebuild
