name: Port theme bindings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/port-theme-bindings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-store-bindings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove store-specific bindings only
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          APP_PREFIX = 'shopify://apps/'
          targets = [
              Path('config/settings_data.json'),
              Path('templates/product.json'),
              Path('templates/product.no-add-to-cart.json'),
              Path('templates/product.sample.json'),
              Path('templates/product.smart-gummies.json'),
              Path('templates/page.uae.json'),
              Path('templates/page.pampagana.json'),
          ]

          removed_app_blocks = []
          cleared_variant_ids = []

          def clean(node, path='root'):
              if isinstance(node, dict):
                  # Remove only app-extension block instances. These UUID bindings
                  # are store/app-install specific and cannot be ported safely.
                  for container_key in ('blocks', 'sections'):
                      container = node.get(container_key)
                      if isinstance(container, dict):
                          remove_ids = []
                          for item_id, item in container.items():
                              if isinstance(item, dict) and str(item.get('type', '')).startswith(APP_PREFIX):
                                  remove_ids.append(item_id)
                          for item_id in remove_ids:
                              removed_app_blocks.append(f'{path}.{container_key}.{item_id}')
                              del container[item_id]
                          if remove_ids and isinstance(node.get('block_order'), list):
                              node['block_order'] = [x for x in node['block_order'] if x not in remove_ids]
                          if remove_ids and isinstance(node.get('order'), list):
                              node['order'] = [x for x in node['order'] if x not in remove_ids]

                  for key, value in list(node.items()):
                      current_path = f'{path}.{key}'
                      # Numeric variant IDs are store-specific. Keep product handles
                      # and all design/content; the theme code falls back to the
                      # selected_or_first_available_variant when this is blank.
                      if key == 'box_variant_id' and str(value).strip():
                          cleared_variant_ids.append((current_path, str(value)))
                          node[key] = ''
                      else:
                          clean(value, current_path)
              elif isinstance(node, list):
                  for i, value in enumerate(node):
                      clean(value, f'{path}[{i}]')

          changed = []
          for file in targets:
              if not file.exists():
                  continue
              original = file.read_text(encoding='utf-8')
              data = json.loads(original)
              clean(data, str(file))
              # Keep JSON compact, matching Shopify-generated template style.
              updated = json.dumps(data, ensure_ascii=False, separators=(',', ':'))
              json.loads(updated)  # validation
              if updated != original.strip():
                  file.write_text(updated + '\n', encoding='utf-8')
                  changed.append(str(file))

          print('Changed files:')
          for f in changed:
              print(' -', f)
          print('Removed store-specific app blocks:', len(removed_app_blocks))
          for x in removed_app_blocks:
              print(' -', x)
          print('Cleared store-specific box variant IDs:', len(cleared_variant_ids))
          for path, old in cleared_variant_ids:
              print(' -', path, old)
          PY

      - name: Validate JSON and diff
        run: |
          python <<'PY'
          import json
          from pathlib import Path
          files = [
            'config/settings_data.json',
            'templates/product.json',
            'templates/product.no-add-to-cart.json',
            'templates/product.sample.json',
            'templates/product.smart-gummies.json',
            'templates/page.uae.json',
            'templates/page.pampagana.json',
          ]
          for f in files:
              p = Path(f)
              if p.exists():
                  json.loads(p.read_text(encoding='utf-8'))
                  print('valid', f)
          PY
          git diff --check

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/settings_data.json templates/product*.json templates/page.uae.json templates/page.pampagana.json
          git commit -m 'fix: make imported theme bindings portable to UAE store'
          git push
